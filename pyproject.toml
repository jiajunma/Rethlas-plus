[project]
name = "rethlas-kb"
version = "0.1.0"
description = "Agent layer on top of mdblueprint KB for new research mathematics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rethlas-KB contributors" }]
license = { text = "Proprietary" }
dependencies = [
    "mdblueprint",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
rethlas-kb = "rethlas_kb.cli:main"

# ---------------------------------------------------------------------------
# uv source resolution — mdblueprint is an **editable local path** during
# solo development. When sharing or in CI, this section becomes the
# substitution point (publish mdblueprint to PyPI, or vendor it).
# ---------------------------------------------------------------------------
[tool.uv.sources]
mdblueprint = { path = "/Users/hoxide/mycodes/mdblueprint", editable = true }

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["rethlas_kb*", "rethlas_kb_agents*"]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Test config
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
